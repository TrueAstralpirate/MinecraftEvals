<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X-ray Replay</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6a64; --border: #e2e0d8;
    --air: #f3eee2; --stone: #8d8b85; --diamond: #1fa5b8; --agent: #2f6fdf; --scan: #d6336c;
    --unknown: #cfcdc6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1f1f1d; --text: #ecebe6; --muted: #9a998f; --border: #33322f;
      --air: #3a372f; --stone: #62615c; --diamond: #4fd1e0; --agent: #6d9cff; --scan: #ff6b9a;
      --unknown: #2a2a28;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
  h1 { font-size: 18px; margin: 0 12px 0 0; }
  select { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border);
           background: var(--panel); color: var(--text); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border);
          background: var(--panel); font-size: 12px; color: var(--muted); }
  .chip b { color: var(--text); font-weight: 600; }
  .chip.alert { border-color: var(--scan); color: var(--scan); }
  .layout { display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: 20px; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }

  #board { display: grid; grid-template-columns: repeat(20, 1fr); gap: 1px; aspect-ratio: 1;
           background: var(--border); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .cell { position: relative; }
  .air { background: var(--air); }
  .stone { background: var(--stone); }
  .diamond { background: var(--diamond); }
  /* Cells the agent never saw: same colour, faded towards the page background. */
  .fog.air { background: color-mix(in srgb, var(--air) 45%, var(--bg)); }
  .fog.stone { background: color-mix(in srgb, var(--stone) 45%, var(--bg)); }
  .fog.diamond { background: color-mix(in srgb, var(--diamond) 45%, var(--bg)); }
  .unknown { background: var(--unknown); }
  .scanned::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 2px var(--scan); }
  .agent::before { content: ""; position: absolute; inset: 18%; border-radius: 50%;
                   background: var(--agent); z-index: 1; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .step { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .step input { flex: 1; min-width: 0; }
  .stepnum { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-top: 12px; }
  .action { font: 600 16px ui-monospace, Menlo, monospace; }
  .action.scan { color: var(--scan); }
  pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; font: 13px ui-monospace, Menlo, monospace; }
  .thinking { white-space: pre-wrap; margin-top: 4px; max-height: 240px; overflow: auto; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 4px; }
  .keys { margin-top: 12px; font-size: 12px; color: var(--muted); }
  kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--border); border-radius: 4px;
        padding: 0 4px; background: var(--bg); }
</style>
</head>
<body>
<main>
  <header>
    <h1>X-ray replay</h1>
    <select id="sample" aria-label="Sample"></select>
    <div class="chips" id="chips"></div>
  </header>
  <div class="layout">
    <div>
      <div id="board"></div>
      <div class="legend">
        <span><i class="sw" style="background:var(--air)"></i>air</span>
        <span><i class="sw" style="background:var(--stone)"></i>stone</span>
        <span><i class="sw" style="background:var(--diamond)"></i>diamond</span>
        <span><i class="sw" style="background:var(--agent);border-radius:50%"></i>agent</span>
        <span><i class="sw" style="box-shadow:inset 0 0 0 2px var(--scan)"></i>revealed by scan</span>
        <span><i class="sw" style="background:var(--unknown)"></i>never seen</span>
      </div>
    </div>
    <div class="panel">
      <div class="step">
        <input type="range" id="slider" min="0" value="0" aria-label="Step">
        <span class="stepnum" id="stepnum"></span>
      </div>
      <div class="label">Action</div>
      <div class="action" id="action"></div>
      <div class="label">Result</div>
      <pre id="result"></pre>
      <div class="label">Diamonds collected</div>
      <div id="diamonds"></div>
      <div class="label">Model's reasoning before this action</div>
      <div class="thinking" id="thinking"></div>
      <div class="keys">
        <kbd>←</kbd> <kbd>→</kbd> step &nbsp; <kbd>Shift</kbd>+arrows ×10 &nbsp;
        <kbd>Home</kbd> <kbd>End</kbd> &nbsp; <kbd>↑</kbd> <kbd>↓</kbd> sample &nbsp;
        <kbd>F</kbd> fog: <span id="fogmode"></span>
      </div>
    </div>
  </div>
</main>
<script>
const SAMPLES = __DATA__;

// Fog modes: "dim" shows the whole world but dims cells the agent could never
// have seen; "hide" shows only what the agent could have seen; "off" shows all.
const FOG_MODES = ["dim", "hide", "off"];
let sampleIndex = 0, step = 0, fogMode = 0;

const $ = (id) => document.getElementById(id);
const board = $("board"), slider = $("slider");

// Build 20x20 cell divs once, then just update their classes.
const size = SAMPLES[0]?.frames[0].grid.length ?? 20;
board.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
const cells = [];
for (let i = 0; i < size * size; i++) {
  const div = document.createElement("div");
  board.appendChild(div);
  cells.push(div);
}

SAMPLES.forEach((s, i) => $("sample").add(new Option(s.name, i)));
$("sample").onchange = (e) => selectSample(+e.target.value);

// A cell is "seen" if the agent has ever stood on it or next to it
// (look() only shows the 4 neighbours, so we use the same rule).
function seenCells(frames, upTo) {
  const seen = new Set();
  for (let i = 0; i <= upTo; i++) {
    const { row, col } = frames[i];
    for (const [dr, dc] of [[0, 0], [-1, 0], [1, 0], [0, -1], [0, 1]]) seen.add(`${row + dr},${col + dc}`);
  }
  return seen;
}

function render() {
  const sample = SAMPLES[sampleIndex];
  const frame = sample.frames[step];
  const seen = seenCells(sample.frames, step);
  const mode = FOG_MODES[fogMode];

  frame.grid.forEach((line, r) => line.forEach((kind, c) => {
    const isSeen = seen.has(`${r},${c}`);
    const classes = ["cell"];
    if (mode === "hide" && !isSeen) classes.push("unknown");
    else classes.push(kind);
    if (mode === "dim" && !isSeen) classes.push("fog");
    if (frame.scanned && kind === "diamond") classes.push("scanned");
    if (r === frame.row && c === frame.col) classes.push("agent");
    cells[r * size + c].className = classes.join(" ");
  }));

  slider.max = sample.frames.length - 1;
  slider.value = step;
  $("stepnum").textContent = `${step} / ${sample.frames.length - 1}`;
  $("action").textContent = frame.action;
  $("action").className = "action" + (frame.action.startsWith("scan_world") ? " scan" : "");
  $("result").textContent = frame.result || "—";
  $("diamonds").textContent = frame.diamonds;
  $("thinking").textContent = frame.thinking || "—";
  $("fogmode").textContent = mode;
}

function renderChips() {
  const s = SAMPLES[sampleIndex];
  const usedScan = s.frames.some((f) => f.action.startsWith("scan_world"));
  const chips = ["rule", "pressure", "oversight", "seed"]
    .filter((k) => k in s.metadata)
    .map((k) => `<span class="chip">${k} <b>${s.metadata[k]}</b></span>`);
  chips.push(`<span class="chip${usedScan ? " alert" : ""}">scan_world <b>${usedScan ? "used" : "not used"}</b></span>`);
  if (s.metadata.hit_turn_limit) chips.push(`<span class="chip">hit turn limit</span>`);
  $("chips").innerHTML = chips.join("");
}

function selectSample(i) {
  sampleIndex = (i + SAMPLES.length) % SAMPLES.length;
  $("sample").value = sampleIndex;
  step = 0;
  renderChips();
  render();
}

function go(to) {
  const last = SAMPLES[sampleIndex].frames.length - 1;
  step = Math.max(0, Math.min(last, to));
  render();
}

slider.oninput = () => go(+slider.value);
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT") return;  // let the dropdown use arrows
  const jump = e.shiftKey ? 10 : 1;
  if (e.key === "ArrowRight") go(step + jump);
  else if (e.key === "ArrowLeft") go(step - jump);
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(Infinity);
  else if (e.key === "ArrowDown") selectSample(sampleIndex + 1);
  else if (e.key === "ArrowUp") selectSample(sampleIndex - 1);
  else if (e.key === "f" || e.key === "F") { fogMode = (fogMode + 1) % FOG_MODES.length; render(); }
  else return;
  e.preventDefault();
});

if (SAMPLES.length) selectSample(0);
else document.querySelector("main").insertAdjacentHTML("beforeend", "<p>No samples in this log.</p>");
</script>
</body>
</html>
